<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R Music</title>
    <!-- Spotify Client ID — แก้ค่านี้ตรงนี้เลย -->
    <meta name="spotify-client-id" content="YOUR_CLIENT_ID_HERE" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
  --bg-dark: #0f0f11;
  --bg-panel: rgba(25, 25, 30, 0.6);
  --text-main: #ffffff;
  --text-muted: #a0a0a5;
  --accent: #1db954;
  --accent-glow: rgba(29, 185, 84, 0.4);
  --player-height: 90px;
  --sidebar-width: 240px;
  --glass-border: rgba(255, 255, 255, 0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Kanit', 'Outfit', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.hidden { display: none !important; }
.screen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.glass-panel {
  background: var(--bg-panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
}
#login-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #1a1a24 0%, var(--bg-dark) 100%);
}
.login-card { padding: 3rem; border-radius: 24px; text-align: center; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
.login-card h1 { font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(135deg,#fff,#a0a0a5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-card p { color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }
.btn-primary { background-color: var(--accent); color: #fff; border: none; padding: 1rem 2rem; border-radius: 30px; font-size: 1.1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: transform .2s,box-shadow .2s,background-color .2s; box-shadow: 0 4px 15px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); background-color: #1ed760; }
#app-screen { display: grid; grid-template-columns: var(--sidebar-width) 1fr; grid-template-rows: 1fr var(--player-height); grid-template-areas: "sidebar main" "player player"; }
.ambient-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%,var(--accent-glow) 0%,transparent 50%); z-index: -1; transition: background 1s ease; }
.sidebar { grid-area: sidebar; display: flex; flex-direction: column; padding: 1.5rem; border-right: 1px solid var(--glass-border); }
.logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 2rem; letter-spacing: 1px; }
nav { display: flex; flex-direction: column; gap: .5rem; flex: 1; }
.nav-item { color: var(--text-muted); text-decoration: none; font-size: 1.1rem; padding: .75rem 1rem; border-radius: 12px; transition: all .2s; font-weight: 500; }
.nav-item:hover,.nav-item.active { color: var(--text-main); background: rgba(255,255,255,.05); }
.user-profile { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border); }
.user-profile img { width: 32px; height: 32px; border-radius: 50%; }
.main-content { grid-area: main; overflow-y: auto; padding: 2rem; position: relative; }
.top-bar { position: sticky; top: 0; z-index: 10; padding: 1rem; border-radius: 100px; margin-bottom: 2rem; display: flex; }
#search-input { width: 100%; background: transparent; border: none; color: var(--text-main); font-family: inherit; font-size: 1.1rem; outline: none; padding: .5rem 1rem; }
#search-input::placeholder { color: var(--text-muted); }
.view { display: none; }
.view.active { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
h2 { font-size: 2rem; margin-bottom: 1.5rem; font-weight: 700; }
h3 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 600; color: var(--text-muted); }
.search-section { margin-bottom: 2rem; }
.playlists-grid,.history-grid,.artists-grid,.albums-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 1.5rem; }
.playlist-card,.track-item { background: rgba(255,255,255,.02); border-radius: 16px; padding: 1rem; transition: all .3s ease; cursor: pointer; }
.playlist-card:hover,.track-item:hover { background: rgba(255,255,255,.08); transform: translateY(-5px); }
.playlist-card img { width: 100%; aspect-ratio: 1; border-radius: 12px; margin-bottom: 1rem; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.playlist-title { font-weight: 600; margin-bottom: .25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playlist-owner { color: var(--text-muted); font-size: .9rem; }
.tracks-list { display: flex; flex-direction: column; gap: .5rem; }
.track-item { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; border-radius: 12px; transform: none; }
.track-item:hover { transform: translateX(5px); }
.track-item img { width: 48px; height: 48px; border-radius: 8px; }
.track-item-info { flex: 1; overflow: hidden; }
.track-item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item-artist { color: var(--text-muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player { grid-area: player; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; border-top: 1px solid var(--glass-border); z-index: 20; }
.track-info { display: flex; align-items: center; gap: 1rem; width: 30%; }
#player-art { width: 56px; height: 56px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.track-details { display: flex; flex-direction: column; }
.track-title { font-weight: 600; font-size: 1.1rem; }
.track-artist { color: var(--text-muted); font-size: .9rem; }
.player-controls { display: flex; align-items: center; gap: 1.5rem; flex: 1; justify-content: center; }
.btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
.btn-icon:hover { color: var(--text-main); transform: scale(1.1); }
.btn-icon svg { width: 24px; height: 24px; }
.btn-play { background: var(--text-main); color: var(--bg-dark); width: 48px; height: 48px; border-radius: 50%; }
.btn-play:hover { transform: scale(1.05); color: var(--bg-dark); background: var(--accent); }
.player-extra { width: 30%; display: flex; justify-content: flex-end; }
.lyrics-btn { background: rgba(255,255,255,.1); padding: .5rem 1rem; border-radius: 20px; font-weight: 600; font-size: .9rem; color: var(--text-main); }
.lyrics-btn:hover { background: rgba(255,255,255,.2); }
.lyrics-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-dark); z-index: 50; display: flex; flex-direction: column; transition: transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s ease; }
.lyrics-modal.hidden { display: flex !important; transform: translateY(100%); opacity: 0; pointer-events: none; }
.modal-blobs { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .8; will-change: transform; }
.blob-1 { width: 60vw; height: 60vw; top: -15%; left: -10%; background: var(--blob1,rgba(80,80,200,.6)); animation: blob-move-1 14s ease-in-out infinite alternate; }
.blob-2 { width: 55vw; height: 55vw; bottom: -20%; right: -10%; background: var(--blob2,rgba(200,80,80,.5)); animation: blob-move-2 18s ease-in-out infinite alternate; }
.blob-3 { width: 40vw; height: 40vw; top: 30%; left: 30%; background: var(--blob3,rgba(80,160,100,.35)); animation: blob-move-3 22s ease-in-out infinite alternate; }
@keyframes blob-move-1 { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(8%,12%) scale(1.1)} 66%{transform:translate(-5%,20%) scale(.95)} 100%{transform:translate(12%,5%) scale(1.05)} }
@keyframes blob-move-2 { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(-10%,-8%) scale(1.08)} 66%{transform:translate(6%,-15%) scale(1.12)} 100%{transform:translate(-5%,10%) scale(.95)} }
@keyframes blob-move-3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-15%,10%) scale(1.2)} 100%{transform:translate(10%,-12%) scale(.9)} }
.lyrics-modal > *:not(.modal-blobs) { position: relative; z-index: 1; }
.lyrics-modal-btns { position: absolute; top: 2rem; right: 2.5rem; display: flex; align-items: center; gap: .5rem; z-index: 60; }
.btn-modal-icon { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: var(--text-muted); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; backdrop-filter: blur(8px); }
.btn-modal-icon:hover { background: rgba(255,255,255,.18); color: var(--text-main); transform: scale(1.1); }
.btn-modal-icon svg { width: 22px; height: 22px; }
.lyrics-layout { display: flex; width: 100%; height: 100%; padding: 4rem; gap: 4rem; align-items: center; }
.lyrics-left { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; max-width: 500px; margin-left: auto; }
.lyrics-left img { width: 100%; aspect-ratio: 1; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); margin-bottom: 3rem; object-fit: cover; }
.lyrics-track-details { margin-bottom: 2rem; width: 100%; }
.lyrics-track-title { font-size: 2.5rem; font-weight: 700; margin-bottom: .5rem; line-height: 1.2; white-space: nowrap; overflow: hidden; width: 100%; }
.lyrics-track-title .marquee-inner { display: inline-block; white-space: nowrap; }
.lyrics-track-title.is-overflow .marquee-inner { animation: marquee-scroll 30s linear infinite; padding-right: 3rem; }
@keyframes marquee-scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.lyrics-track-artist { font-size: 1.4rem; color: var(--text-muted); }
.lyrics-controls { display: flex; align-items: center; gap: 1.5rem; width: 100%; }
.lyrics-right { flex: 1.2; display: flex; flex-direction: column; height: 90%; margin-right: auto; -webkit-mask-image: linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%); mask-image: linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%); }
.lyrics-container { width: 100%; height: 100%; display: flex; }
am-lyrics { width: 100%; height: 100%; max-width: 800px; --am-lyrics-color-active: var(--text-main); --am-lyrics-color-inactive: rgba(255,255,255,.4); text-align: left; pointer-events: none; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.4); }
.context-menu { position: absolute; background: rgba(30,30,35,.95); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 8px; padding: .5rem 0; min-width: 200px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.context-menu.hidden { display: none; }
.menu-item { padding: .75rem 1.5rem; cursor: pointer; transition: background .2s; color: var(--text-main); font-size: .95rem; }
.menu-item:hover { background: rgba(255,255,255,.1); }
.playlist-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.playlist-modal.hidden { display: none; }
.playlist-modal-content { width: 400px; max-width: 90%; padding: 2rem; border-radius: 16px; display: flex; flex-direction: column; max-height: 80vh; }
.playlist-list { flex: 1; overflow-y: auto; margin: 1rem 0; display: flex; flex-direction: column; gap: .5rem; }
.playlist-list-item { padding: .75rem; background: rgba(255,255,255,.05); border-radius: 8px; cursor: pointer; transition: background .2s; }
.playlist-list-item:hover { background: rgba(255,255,255,.1); }
.btn-close-playlist { background: rgba(255,255,255,.1); color: var(--text-main); border: none; padding: .75rem; border-radius: 12px; cursor: pointer; }
.btn-close-playlist:hover { background: rgba(255,255,255,.2); }
.toast-container { position: fixed; bottom: 100px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
.toast { background: var(--bg-panel); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px 24px; border-radius: 8px; font-size: .95rem; box-shadow: 0 4px 12px rgba(0,0,0,.3); opacity: 0; transform: translateY(20px); transition: all .3s ease; }
.toast-error { border-left: 4px solid #e74c3c; }
.toast-info { border-left: 4px solid var(--accent); }
@media (max-width:768px) {
  #app-screen { grid-template-columns: 1fr; grid-template-rows: 1fr var(--player-height) 60px; grid-template-areas: "main" "player" "sidebar"; }
  .sidebar { flex-direction: row; padding: 0; border-right: none; border-top: 1px solid var(--glass-border); height: 60px; background: var(--bg-dark); z-index: 30; }
  .sidebar .logo,.sidebar .user-profile { display: none; }
  .sidebar nav { flex-direction: row; width: 100%; justify-content: space-around; align-items: center; }
  .nav-item { font-size: 1rem; padding: .5rem; flex: 1; text-align: center; border-radius: 0; }
  .nav-item.active { background: transparent; color: var(--accent); font-weight: 700; }
  .main-content { padding: 1rem; }
  .playlists-grid,.history-grid,.artists-grid,.albums-grid { grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 1rem; }
  .login-card { padding: 2rem; width: 90%; }
  .player { padding: 0 1rem; gap: .5rem; }
  .track-info { width: auto; flex: 1; overflow: hidden; }
  .track-title,.track-artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-controls { width: auto; flex: none; gap: .5rem; }
  .player-extra { width: auto; flex: none; }
  .btn-icon svg { width: 20px; height: 20px; }
  .btn-play { width: 36px; height: 36px; }
  .lyrics-btn { padding: .4rem .8rem; font-size: .8rem; }
  .lyrics-layout { flex-direction: column; padding: 1rem; padding-top: 4rem; gap: 1.5rem; justify-content: flex-start; overflow-y: auto; }
  .lyrics-left { max-width: 100%; align-items: center; text-align: center; margin-left: 0; }
  .lyrics-left img { width: 60%; max-width: 250px; margin-bottom: 1.5rem; }
  .lyrics-track-title { font-size: 1.5rem; }
  .lyrics-track-artist { font-size: 1rem; }
  .lyrics-controls { justify-content: center; }
  .lyrics-right { flex: none; height: 50vh; margin-right: 0; width: 100%; }
  am-lyrics { text-align: center; }
  .playlist-modal-content { width: 90%; padding: 1.5rem; }
}
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-card glass-panel">
        <h1>R Music</h1>
        <p>Log in with your Spotify Premium account to experience the music.</p>
        <button id="login-button" class="btn-primary">Connect with Spotify</button>
      </div>
    </div>

    <!-- Main App Layout -->
    <div id="app-screen" class="screen hidden">
      <div class="ambient-background" id="ambient-bg"></div>
      <aside class="sidebar glass-panel">
        <div class="logo">R Music</div>
        <nav>
          <a href="#" class="nav-item active" data-target="home">Home</a>
          <a href="#" class="nav-item" data-target="search">Search</a>
        </nav>
        <div class="user-profile" id="user-profile"></div>
      </aside>

      <main class="main-content">
        <header class="top-bar glass-panel hidden" id="search-bar-container">
          <input type="text" id="search-input" placeholder="Search for songs, artists, albums..." />
        </header>

        <div class="view active" id="view-home">
          <h2>ประวัติการฟัง</h2>
          <div class="history-grid" id="history-grid"></div>
        </div>

        <div class="view" id="view-search">
          <h2>Search Results</h2>
          <div class="search-section">
            <h3>Artists</h3>
            <div class="artists-grid" id="search-artists"></div>
          </div>
          <div class="search-section">
            <h3>Tracks</h3>
            <div class="tracks-list" id="search-results"></div>
          </div>
        </div>

        <div class="view" id="view-artist">
          <div class="artist-header" id="artist-header"></div>
          <h3>Top Tracks</h3>
          <div class="tracks-list" id="artist-top-tracks"></div>
          <h3>Albums</h3>
          <div class="albums-grid" id="artist-albums"></div>
        </div>
      </main>
    </div>

    <!-- Bottom Player -->
    <div id="player-screen" class="player glass-panel hidden">
      <div class="track-info">
        <img id="player-art" src="" alt="Album Art" class="hidden" />
        <div class="track-details">
          <div id="player-title" class="track-title"></div>
          <div id="player-artist" class="track-artist"></div>
        </div>
      </div>
      <div class="player-controls">
        <button id="btn-prev" class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg></button>
        <button id="btn-play-pause" class="btn-icon btn-play">
          <svg id="icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
        </button>
        <button id="btn-next" class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg></button>
      </div>
      <div class="player-extra">
        <button id="btn-lyrics-toggle" class="btn-icon lyrics-btn">Lyrics</button>
      </div>
    </div>

    <!-- Lyrics Modal -->
    <div id="lyrics-modal" class="lyrics-modal hidden">
      <div class="lyrics-modal-btns">
        <button id="btn-fullscreen-lyrics" class="btn-modal-icon" title="เต็มหน้าจอ">
          <svg id="icon-fullscreen-enter" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <svg id="icon-fullscreen-exit" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
        </button>
        <button id="btn-close-lyrics" class="btn-modal-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/></svg>
        </button>
      </div>
      <div class="lyrics-layout">
        <div class="lyrics-left">
          <img id="lyrics-modal-art" src="" alt="Album Art" />
          <div class="lyrics-track-details">
            <div id="lyrics-modal-title" class="lyrics-track-title"></div>
            <div id="lyrics-modal-artist" class="lyrics-track-artist"></div>
          </div>
          <div class="lyrics-controls">
            <button id="btn-lyrics-prev" class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg></button>
            <button id="btn-lyrics-play-pause" class="btn-icon btn-play">
              <svg id="lyrics-icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
              <svg id="lyrics-icon-pause" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
            </button>
            <button id="btn-lyrics-next" class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg></button>
          </div>
        </div>
        <div class="lyrics-right">
          <div id="lyrics-container" class="lyrics-container"></div>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="menu-item" id="menu-play-next">เล่นถัดไป</div>
      <div class="menu-item" id="menu-add-playlist">เพิ่มไปยังเพลย์ลิสต์...</div>
    </div>

    <!-- Playlist Selection Modal -->
    <div id="playlist-modal" class="playlist-modal hidden">
      <div class="playlist-modal-content glass-panel">
        <h3>เลือกเพลย์ลิสต์</h3>
        <div id="playlist-list" class="playlist-list"></div>
        <button class="btn-close-playlist" onclick="document.getElementById('playlist-modal').classList.add('hidden')">ปิด</button>
      </div>
    </div>

    <!-- Spotify Web Playback SDK -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <!-- am-lyrics -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

    <script type="module">
// ============================================================
// CONFIG — อ่าน Client ID จาก <meta> tag
// ============================================================
const CLIENT_ID = document.querySelector('meta[name="spotify-client-id"]')?.content || '';
const REDIRECT_URI = window.location.origin;

// ============================================================
// SPOTIFY AUTH (PKCE)
// ============================================================
function generateRandomString(length) {
  let text = '';
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));

  return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)])).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function loginWithSpotify() {
  if (!CLIENT_ID || CLIENT_ID === 'YOUR_CLIENT_ID_HERE') { alert('กรุณาใส่ Spotify Client ID ใน <meta name="spotify-client-id"> ใน index.html'); return; }
  const verifier = generateRandomString(128);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('spotify_verifier', verifier);
  const params = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI, code_challenge_method: 'S256', code_challenge: challenge, scope: ['user-read-private','user-read-email','streaming','user-read-playback-state','user-modify-playback-state','user-library-read','playlist-read-private','playlist-read-collaborative','user-top-read','user-read-recently-played'].join(' ') });

async function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    window.history.replaceState({}, document.title, '/');
    const verifier = localStorage.getItem('spotify_verifier');
    const body = new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: verifier });
    try {
      const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const data = await response.json();
      localStorage.setItem('spotify_access_token', data.access_token);
      localStorage.setItem('spotify_refresh_token', data.refresh_token);
      return data.access_token;
    } catch (error) { console.error('Error fetching token:', error); return null; }

}

async function fetchWebApi(endpoint, method = 'GET', body) {
  const token = localStorage.getItem('spotify_access_token');
  const res = await fetch(`https://api.spotify.com/${endpoint}`, { headers: { Authorization: `Bearer ${token}` }, method, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { localStorage.removeItem('spotify_access_token'); window.location.reload(); }
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  if (res.status === 204) return null;
  return await res.json();
}

let lyricsUpdateInterval;
function updateLyricsComponent(positionMs, durationMs, paused) {
  clearInterval(lyricsUpdateInterval);

  if (positionMs !== undefined) { lyricsEl.setAttribute('current-time', positionMs); lyricsEl.setAttribute('duration', paused ? -1 : durationMs); }
  if (!paused && positionMs !== undefined) {
    let currentPos = positionMs, lastTime = performance.now();
    lyricsUpdateInterval = setInterval(() => { const now = performance.now(); currentPos += (now-lastTime); lastTime = now; lyricsEl.setAttribute('current-time', currentPos); lyricsEl.currentTime = currentPos; }, 100);
  }
}
async function setupLyricsComponent(track) {

  const album = track.album.name;
  let isrc = '';
  try { const fullTrack = await fetchWebApi(`v1/tracks/${track.id}`); if (fullTrack?.external_ids?.isrc) isrc = fullTrack.external_ids.isrc; } catch(e) {}
  if (currentTrackData && currentTrackData.id !== track.id) return;

  function fixThaiSpans(root) {
    root.querySelectorAll('.char:not(.th-ok)').forEach(span => {
      span.classList.add('th-ok');
      if (span.textContent && THAI_COMBINING.test(span.textContent)) { let prev = span.previousElementSibling; while (prev && (!prev.classList.contains('char') || prev.style.display==='none')) prev = prev.previousElementSibling; if (prev) { prev.textContent += span.textContent; span.textContent = ''; span.style.display = 'none'; } }
    });
  }
  const waitForShadow = setInterval(() => { if (lyricsEl.shadowRoot) { clearInterval(waitForShadow); fixThaiSpans(lyricsEl.shadowRoot); new MutationObserver(()=>fixThaiSpans(lyricsEl.shadowRoot)).observe(lyricsEl.shadowRoot,{childList:true,subtree:true}); } }, 50);
}

  window.showTrackContextMenu = (e, track) => { currentContextTrack = track; menu.style.left = `${e.pageX}px`; menu.style.top = `${e.pageY}px`; menu.classList.remove('hidden'); };
  document.getElementById('menu-play-next').addEventListener('click', async () => {
    if (currentContextTrack) { try { await fetchWebApi(`v1/me/player/queue?uri=${currentContextTrack.uri}`, 'POST'); showToast('✅ เพิ่มลงในคิวแล้ว', 'info'); } catch(e) { showToast('❌ ไม่สามารถเพิ่มลงคิวได้', 'error'); } }
    menu.classList.add('hidden');
  });
  document.getElementById('menu-add-playlist').addEventListener('click', async () => {
    if (currentContextTrack) {
      document.getElementById('playlist-modal').classList.remove('hidden');
      const listContainer = document.getElementById('playlist-list'); listContainer.innerHTML = 'กำลังโหลด...';
      try {
        const user = await getUserProfile();
        const playlists = await fetchWebApi('v1/me/playlists?limit=50');
        const myPlaylists = playlists.items.filter(p => p.owner.id === user.id);
        listContainer.innerHTML = '';
        if (myPlaylists.length === 0) { listContainer.innerHTML = 'ไม่พบเพลย์ลิสต์ของคุณ'; }
        else { myPlaylists.forEach(p => { const item = document.createElement('div'); item.className = 'playlist-list-item'; item.textContent = p.name; item.onclick = async () => { try { await fetchWebApi(`v1/playlists/${p.id}/tracks?uris=${currentContextTrack.uri}`, 'POST'); showToast(`✅ เพิ่มเพลงลงใน ${p.name} แล้ว`, 'info'); document.getElementById('playlist-modal').classList.add('hidden'); } catch(err) { showToast('❌ ไม่สามารถเพิ่มเพลงได้', 'error'); } }; listContainer.appendChild(item); }); }
      } catch(e) { listContainer.innerHTML = 'เกิดข้อผิดพลาดในการโหลดเพลย์ลิสต์'; }
    }
    menu.classList.add('hidden');
  });
}

function handlePlayerStateChange(state) {
  if (!state) return;
  updatePlayerUI(state);
  const track = state.track_window.current_track;
  const lyricsContainer = document.getElementById('lyrics-container');
  const containerEmpty = !lyricsContainer || lyricsContainer.children.length === 0;
  if (track && (!currentTrackData || currentTrackData.id !== track.id || containerEmpty)) { currentTrackData = track; setupLyricsComponent(track); }
  updateLyricsComponent(state.position, state.duration, state.paused);
}

init();
    </script>
  </body>
