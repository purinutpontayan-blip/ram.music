<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R Music</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Login Screen (Hidden when authenticated) -->
    <div id="login-screen" class="screen">
      <div class="login-card glass-panel">
        <h1>R Music</h1>
        <p>Log in with your Spotify Premium account to experience the music.</p>
        <button id="login-button" class="btn-primary">Connect with Spotify</button>
      </div>
    </div>

    <!-- Main App Layout (Hidden when not authenticated) -->
    <div id="app-screen" class="screen hidden">
      <!-- Background Ambient Glow -->
      <div class="ambient-background" id="ambient-bg"></div>

      <!-- Sidebar -->
      <aside class="sidebar glass-panel">
        <div class="logo">R Music</div>
        <nav>
          <a href="#" class="nav-item active" data-target="home">Home</a>
          <a href="#" class="nav-item" data-target="search">Search</a>
        </nav>
        <div class="user-profile" id="user-profile">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Top Bar for Search -->
        <header class="top-bar glass-panel hidden" id="search-bar-container">
          <input type="text" id="search-input" placeholder="Search for songs, artists, albums..." />
        </header>

        <!-- View Containers -->
        <div class="view active" id="view-home">
          <h2>ประวัติการฟัง</h2>
          <div class="history-grid" id="history-grid">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="view" id="view-search">
          <h2>Search Results</h2>
          <div class="search-section">
            <h3>Artists</h3>
            <div class="artists-grid" id="search-artists"></div>
          </div>
          <div class="search-section">
            <h3>Tracks</h3>
            <div class="tracks-list" id="search-results">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>

        <div class="view" id="view-artist">
          <div class="artist-header" id="artist-header">
            <!-- Populated by JS -->
          </div>
          <h3>Top Tracks</h3>
          <div class="tracks-list" id="artist-top-tracks"></div>
          <h3>Albums</h3>
          <div class="albums-grid" id="artist-albums"></div>
        </div>
      </main>
    <!-- Bottom Player (Hidden when not authenticated) -->
    <div id="player-screen" class="player glass-panel hidden">
      <div class="track-info">
        <img id="player-art" src="" alt="Album Art" class="hidden" />
        <div class="track-details">
          <div id="player-title" class="track-title"></div>
          <div id="player-artist" class="track-artist"></div>
        </div>
      </div>
      
      <div class="player-controls">
        <button id="btn-prev" class="btn-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
        </button>
        <button id="btn-play-pause" class="btn-icon btn-play">
          <!-- Play icon default -->
          <svg id="icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z" /></svg>
        </button>
        <button id="btn-next" class="btn-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
        </button>
      </div>

      <div class="player-extra">
        <button id="btn-lyrics-toggle" class="btn-icon lyrics-btn">Lyrics</button>
      </div>
    </div>
    </div>

    <!-- Lyrics Modal -->
    <div id="lyrics-modal" class="lyrics-modal hidden">
      <div class="lyrics-modal-btns">
        <button id="btn-fullscreen-lyrics" class="btn-modal-icon" title="เต็มหน้าจอ">
          <!-- Enter fullscreen icon -->
          <svg id="icon-fullscreen-enter" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <!-- Exit fullscreen icon -->
          <svg id="icon-fullscreen-exit" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
        </button>
        <button id="btn-close-lyrics" class="btn-modal-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z" /></svg>
        </button>
      </div>
      
      <div class="lyrics-layout">
        <div class="lyrics-left">
          <img id="lyrics-modal-art" src="" alt="Album Art" />
          <div class="lyrics-track-details">
            <div id="lyrics-modal-title" class="lyrics-track-title"></div>
            <div id="lyrics-modal-artist" class="lyrics-track-artist"></div>
          </div>
          
          <div class="lyrics-controls">
            <button id="btn-lyrics-prev" class="btn-icon">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
            </button>
            <button id="btn-lyrics-play-pause" class="btn-icon btn-play">
              <svg id="lyrics-icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
              <svg id="lyrics-icon-pause" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z" /></svg>
            </button>
            <button id="btn-lyrics-next" class="btn-icon">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
            </button>
          </div>
        </div>
        
        <div class="lyrics-right">
          <div id="lyrics-container" class="lyrics-container">
            <!-- am-lyrics will be injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="menu-item" id="menu-play-next">เล่นถัดไป</div>
      <div class="menu-item" id="menu-add-playlist">เพิ่มไปยังเพลย์ลิสต์...</div>
    </div>
    
    <!-- Playlist Selection Modal -->
    <div id="playlist-modal" class="playlist-modal hidden">
        <div class="playlist-modal-content glass-panel">
            <h3>เลือกเพลย์ลิสต์</h3>
            <div id="playlist-list" class="playlist-list">
                <!-- Loading... -->
            </div>
            <button class="btn-close-playlist" onclick="document.getElementById('playlist-modal').classList.add('hidden')">ปิด</button>
        </div>
    </div>

    <!-- Spotify Web Playback SDK -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <!-- am-lyrics -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
